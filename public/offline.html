<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Office Chat — offline</title>
  <style>
    :root { --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #64748b; --accent: #4f46e5; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8; } }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
    .card { max-width: 360px; text-align: center; background: var(--card); border-radius: 18px; padding: 2rem 1.5rem; }
    img { width: 64px; height: 64px; border-radius: 16px; }
    h1 { font-size: 1.25rem; margin: 1rem 0 0.5rem; }
    p { color: var(--muted); margin: 0 0 1.25rem; line-height: 1.5; }
    button { border: none; background: var(--accent); color: #fff; font-weight: 600; padding: 0.65rem 1.4rem; border-radius: 12px; font-size: 0.95rem; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>Office Chat needs a connection to send and receive messages. It will reconnect when you're back online.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
  <script>window.addEventListener("online", () => location.reload());</script>
</body>
</html>
